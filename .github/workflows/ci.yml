name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      # fetch-depth: 0 pulls full history + tags so MinVer can derive the version from the git tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OmniCard.slnx

      - name: Build
        run: dotnet build OmniCard.slnx --no-restore -c Release

      - name: Test with coverage
        run: dotnet test OmniCard.Tests/OmniCard.Tests.csproj --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
          retention-days: 30

  # Same build + suite on Linux, the Docker deployment target. Tesseract/Leptonica come from the distro
  # (the Tesseract NuGet package only bundles Windows binaries) and QuestPDF needs system fonts.
  build-and-test-linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtesseract5 liblept5 fonts-dejavu-core fonts-liberation

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OmniCard.slnx

      - name: Build
        run: dotnet build OmniCard.slnx --no-restore -c Release

      - name: Test
        run: dotnet test OmniCard.Tests/OmniCard.Tests.csproj --no-build -c Release

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Re-run the full CI build+test suite before publishing anything, so a release can never ship
  # from a broken build.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: windows-latest

    steps:
      # fetch-depth: 0 pulls full history + tags so MinVer can derive the version from the release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # --- Build the React SPA into OmniCard.Web/wwwroot/app so `dotnet publish` picks it up. ---
      - name: Build SPA
        working-directory: OmniCard.Web/ClientApp
        run: |
          npm ci
          npm run build

      # --- Web app: framework-dependent package for IIS. Self-contained=false keeps it small; the
      #     target IIS server needs the matching .NET 10 ASP.NET Core Hosting Bundle installed (see
      #     README). -r win-x64 scopes native assets (SQLite, SkiaSharp, etc.) to one RID. dotnet
      #     publish auto-generates web.config with the ASP.NET Core Module entry, so the zip is
      #     drop-in ready for an IIS site root. ---
      - name: Publish web app
        run: >
          dotnet publish OmniCard.Web/OmniCard.Web.csproj -c Release -r win-x64
          --self-contained false
          -p:MinVerVersionOverride=${{ steps.version.outputs.VERSION }}
          -o publish-web

      - name: Package web release
        shell: bash
        run: |
          ROOT="$PWD"
          ARTIFACT="OmniCard-Web-v${{ steps.version.outputs.VERSION }}-iis.zip"
          rm -f publish-web/*.pdb
          cd publish-web
          7z a -tzip "$ROOT/$ARTIFACT" ./*
          cd "$ROOT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} "OmniCard-Web-v${{ steps.version.outputs.VERSION }}-iis.zip"
